name: Build and Release C# Extension (with Roslyn Server)

on:
  workflow_dispatch:
  #schedule:
  #  - cron: '0 9 * * *'
  #push:
  #  branches: [main, master]

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check_commit.outputs.should_build }}
      latest_tag: ${{ steps.get_upstream.outputs.latest_tag }}
      latest_sha: ${{ steps.get_upstream.outputs.latest_sha }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout upstream vscode-csharp
        uses: actions/checkout@v4
        with:
          repository: dotnet/vscode-csharp
          path: upstream

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Get latest tag and commit sha from upstream
        id: get_upstream
        run: |
          cd upstream
          git fetch --tags
          LATEST_TAG=$(git for-each-ref --sort=-creatordate --format '%(refname:short)' refs/tags | head -n1)
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          LATEST_SHA=$(git rev-parse $LATEST_TAG)
          echo "latest_sha=$LATEST_SHA" >> $GITHUB_OUTPUT

      - name: Checkout latest tag
        run: |
          cd upstream
          git checkout ${{ steps.get_upstream.outputs.latest_tag }}

      - name: Read last built sha
        id: readsha
        run: |
          if [ -f .last_built_sha ]; then
            LAST_SHA=$(cat .last_built_sha)
            echo "last_sha=$LAST_SHA" >> $GITHUB_OUTPUT
          else
            echo "last_sha=none" >> $GITHUB_OUTPUT
          fi

      - name: Check if new commit exists
        id: check_commit
        run: |
          if [ "${{ steps.get_upstream.outputs.latest_sha }}" = "${{ steps.readsha.outputs.last_sha }}" ]; then
            echo "No new commit. Skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "New commit detected. Proceeding with build."
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  build-and-release:
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout upstream vscode-csharp
        uses: actions/checkout@v4
        with:
          repository: dotnet/vscode-csharp
          path: upstream

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Checkout latest tag
        run: |
          cd upstream
          git checkout ${{ needs.check-changes.outputs.latest_tag }}

      - name: Change publisher in package.json
        run: |
          cd upstream
          jq '.publisher = "your-namespace"' package.json > package.tmp.json
          mv package.tmp.json package.json

      - name: Install dependencies
        run: |
          cd upstream
          npm install

      - name: Install gulp globally
        run: npm install -g gulp

      - name: Gulp installDependencies
        run: |
          cd upstream
          gulp installDependencies

      - name: Build and package VSIX
        run: |
          cd upstream
          gulp vsix:release:package

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vscode-csharp-${{ needs.check-changes.outputs.latest_tag }}
          path: upstream/vsix/*

      - name: Update last built sha file
        run: |
          echo "${{ needs.check-changes.outputs.latest_sha }}" > .last_built_sha

      - name: Commit updated sha file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add .last_built_sha
          git commit -m "Update last built sha to ${{ needs.check-changes.outputs.latest_sha }}"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
