name: Build and Release C# Extension (with Roslyn Server)

on:
  workflow_dispatch:
  #schedule:
  #  - cron: '0 9 * * *'
  #push:
  #  branches: [main, master]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout upstream vscode-csharp
        uses: actions/checkout@v4
        with:
          repository: dotnet/vscode-csharp
          path: upstream

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Get latest tag and commit sha from upstream
        id: get_upstream
        run: |
          cd upstream
          git fetch --tags
          LATEST_TAG=$(git for-each-ref --sort=-creatordate --format '%(refname:short)' refs/tags | head -n1)
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
          LATEST_SHA=$(git rev-parse $LATEST_TAG)
          echo "LATEST_SHA=$LATEST_SHA" >> $GITHUB_ENV

      - name: Checkout latest tag
        run: |
          cd upstream
          git checkout ${{ env.LATEST_TAG }}

      - name: Change publisher in package.json
        run: |
          cd upstream
          jq '.publisher = "your-namespace"' package.json > package.tmp.json
          mv package.tmp.json package.json

      - name: Read last built sha
        id: readsha
        run: |
          if [ -f .last_built_sha ]; then
            LAST_SHA=$(cat .last_built_sha)
            echo "LAST_SHA=$LAST_SHA" >> $GITHUB_ENV
          else
            echo "LAST_SHA=none" >> $GITHUB_ENV
          fi

      - name: Check if new commit, else exit
        run: |
          if [ "${{ env.LATEST_SHA }}" = "${{ env.LAST_SHA }}" ]; then
            echo "No new commit. Skipping build."
            exit 0
          else
            echo "New commit detected. Proceeding."
          fi

      - name: Install dependencies
        run: |
          cd upstream
          npm install

      - name: Install gulp globally
        run: npm install -g gulp

      - name: Gulp installDependencies
        run: |
          cd upstream
          gulp installDependencies

      - name: Build and package VSIX
        run: |
          cd upstream
          gulp vsix:release:package

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vscode-csharp-${{ env.LATEST_TAG }}
          path: upstream/vsix/*

      - name: Update last built sha file
        run: |
          echo "${{ env.LATEST_SHA }}" > .last_built_sha

      - name: Commit updated sha file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add .last_built_sha
          git commit -m "Update last built sha to ${{ env.LATEST_SHA }}"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
