name: Validate netcoredbg on Windows

# Research only. The branch-scoped push trigger permits the first run without
# putting this workflow on main; workflow_dispatch requires default-branch registration.
on:
  workflow_dispatch:
  push:
    branches:
      - research/netcoredbg-windows-validation
    paths:
      - .github/workflows/validate-netcoredbg-windows.yml
      - scripts/validation/**

permissions:
  contents: read

concurrency:
  group: netcoredbg-windows-validation-${{ github.ref }}
  cancel-in-progress: false

env:
  NETCOREDBG_TAG: 3.2.0-1092
  NETCOREDBG_SHA: 9744e1f051866215611b8440c638042aa2aa2f72
  CORECLR_SHA: 60629d14374c56f1cb51819049ad1fa529307f8d
  SDK8_VERSION: 8.0.418
  SDK10_VERSION: 10.0.400
  DBGSHIM_VERSION: 10.0.731102
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'

jobs:
  validate:
    name: Windows ${{ matrix.arch }} source build and DAP
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
          - arch: arm64
            runner: windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Prepare isolated paths and preserve source line endings
        env:
          VALIDATION_ARCH: ${{ matrix.arch }}
        run: |
          git config --global core.autocrlf false
          $dotnetPath = Join-Path $env:RUNNER_TEMP "netcoredbg-dotnet-$($env:VALIDATION_ARCH)"
          $validationPath = Join-Path $env:RUNNER_TEMP "netcoredbg-validation-$($env:VALIDATION_ARCH)"
          "DOTNET_INSTALL_DIR=$dotnetPath" >> $env:GITHUB_ENV
          "VALIDATION_ROOT=$validationPath" >> $env:GITHUB_ENV

      - name: Checkout validation tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout pinned Samsung source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Samsung/netcoredbg
          ref: ${{ env.NETCOREDBG_SHA }}
          path: validation-inputs/netcoredbg
          persist-credentials: false

      - name: Checkout pinned CoreCLR headers and helper sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dotnet/runtime
          ref: ${{ env.CORECLR_SHA }}
          path: validation-inputs/runtime
          persist-credentials: false
          sparse-checkout: |
            src/coreclr
            src/native
            eng

      - name: Install isolated native .NET SDKs and runtimes
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          architecture: ${{ matrix.arch }}
          dotnet-version: |
            ${{ env.SDK8_VERSION }}
            ${{ env.SDK10_VERSION }}

      - name: Build and validate the pinned debugger
        run: ./scripts/validation/validate-windows.ps1 -Architecture '${{ matrix.arch }}'

      - name: Preserve build outputs and evidence, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: netcoredbg-validation-windows-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            ${{ env.VALIDATION_ROOT }}/evidence/
            ${{ env.VALIDATION_ROOT }}/package/
          if-no-files-found: warn
          retention-days: 14
